name: CI & Build ColorVault

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native macOS App & DMG
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Rust Core & macOS App Bundle
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Package Distribution DMG
        run: |
          chmod +x scripts/create_dmg.sh
          ./scripts/create_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorVault.dmg
          path: build/ColorVault.dmg
          if-no-files-found: error

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ColorVault.dmg
          name: ColorVault Pro ${{ github.ref_name }}
          body: |
            ## ColorVault Pro ${{ github.ref_name }} 🎨
            
            High-performance native macOS menu bar extra application engineered in **Rust** and **Swift/SwiftUI**.
            
            ### What's New:
            - **Interactive Chromatic Color Wheel**: 360° circular hue/saturation picker.
            - **WCAG 2.1 & Delta-E Contrast Auditor**: 1-Click Smart Contrast Auto-Fixer.
            - **Crash-Resilient SQLite Storage**: Permanent Favorites & Custom Palette Studio.
            - **Tailwind UI 50–950 Lightness Scale**: Instant design system generation.
            - **Frosted Glass macOS HUD**: Translucent native aesthetics.
            
            ### Download:
            Download and open `ColorVault.dmg` below, then drag `ColorVault.app` into `/Applications`.
          draft: false
          prerelease: false
